<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登入｜資訊顯示</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="login-body">
    <main class="login-page" aria-label="登入頁">
      <section class="login-panel">
        <div class="login-brand">
          <span>Office Info</span>
          <strong>登入</strong>
          <p>使用你的共用登入帳戶連接所有網站。</p>
        </div>

        <form id="loginForm" class="login-form">
          <label>
            <span>Email</span>
            <input id="loginEmail" name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>密碼</span>
            <input
              id="loginPassword"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button id="loginSubmit" type="submit">登入</button>
          <p id="loginMessage" class="login-message" role="status">請輸入帳戶資料。</p>
        </form>

        <a class="login-back" href="./index.html">返回資訊顯示</a>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
