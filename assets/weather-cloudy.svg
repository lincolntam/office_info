<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" role="img" aria-label="Cloudy">
  <defs>
    <linearGradient id="cloud-main" x1="50" y1="35" x2="126" y2="104">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.48" stop-color="#d9e8f3"/>
      <stop offset="1" stop-color="#a6bed0"/>
    </linearGradient>
    <linearGradient id="cloud-dark" x1="68" y1="76" x2="113" y2="116">
      <stop offset="0" stop-color="#cbddeb" stop-opacity="0"/>
      <stop offset="1" stop-color="#6f8ca2" stop-opacity="0.56"/>
    </linearGradient>
    <filter id="soft" x="-35%" y="-60%" width="170%" height="220%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#20313f" flood-opacity="0.34"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g filter="url(#soft)">
      <ellipse cx="90" cy="83" rx="61" ry="23" fill="url(#cloud-main)"/>
      <ellipse cx="53" cy="86" rx="32" ry="17" fill="#d4e5f1"/>
      <ellipse cx="122" cy="81" rx="35" ry="18" fill="#edf6fb"/>
      <ellipse cx="79" cy="66" rx="35" ry="28" fill="#f7fbff"/>
      <ellipse cx="108" cy="68" rx="31" ry="25" fill="#e7f1f8"/>
      <ellipse cx="90" cy="93" rx="67" ry="18" fill="url(#cloud-dark)"/>
    </g>
  </g>
</svg>
