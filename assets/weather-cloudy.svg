<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" role="img" aria-label="Cloudy">
  <defs>
    <linearGradient id="cloud" x1="56" y1="39" x2="122" y2="105">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#edf6ff"/>
      <stop offset="0.78" stop-color="#c9ddeb"/>
      <stop offset="1" stop-color="#a9c0d2"/>
    </linearGradient>
    <linearGradient id="shade" x1="81" y1="76" x2="102" y2="112">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7c9ab0" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="blur" x="-35%" y="-55%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="shadow" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#22394a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g filter="url(#blur)">
      <ellipse cx="90" cy="87" rx="62" ry="22" fill="url(#cloud)"/>
      <ellipse cx="51" cy="88" rx="32" ry="17" fill="#dcebf5"/>
      <ellipse cx="123" cy="84" rx="34" ry="19" fill="#f8fcff"/>
      <ellipse cx="78" cy="68" rx="34" ry="28" fill="#ffffff"/>
      <ellipse cx="109" cy="70" rx="31" ry="25" fill="#eaf4fb"/>
      <ellipse cx="91" cy="97" rx="66" ry="15" fill="url(#shade)"/>
    </g>
  </g>
</svg>
