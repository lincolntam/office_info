<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智慧資訊</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="display-shell" aria-label="640 x 480 智慧資訊">
      <div id="stage" class="stage" aria-label="Smart Stack 智慧資訊">
        <section id="home" class="stack-panel" aria-label="主頁">
          <article class="smart-card home-card">
            <img id="homeBackdrop" class="card-media" src="./assets/space-launch.svg" alt="" />
            <div class="hero-scrim"></div>
            <div class="home-clock">
              <time id="clock" datetime="">00:00</time>
              <p id="dateText">6月1日 星期一</p>
            </div>
          </article>
        </section>

        <section id="spotify" class="stack-panel" aria-label="Spotify 播放">
          <article class="smart-card music-card">
            <img id="albumBackdrop" class="album-backdrop" src="./assets/taeyeon-four-seasons.jpg" alt="" />
            <div class="hero-scrim music-scrim"></div>
            <div class="music-topline">
              <button id="spotifyLogin" class="device-pill" type="button">登入 Spotify</button>
            </div>
            <div class="music-copy">
              <p id="trackTitle">沒有播放內容</p>
              <span id="trackArtist">請在 Spotify 播放歌曲</span>
            </div>
            <button id="playPause" class="widget-play-button" type="button" aria-label="暫停">
              <span class="pause-icon" aria-hidden="true"></span>
            </button>
            <div class="spotify-widget-controls" aria-label="Spotify 控制">
              <button id="saveTrack" type="button" aria-label="加入音樂庫">+</button>
              <div class="progress-shell" aria-hidden="true">
                <span id="progressBar" class="widget-progress"></span>
              </div>
              <button id="nextTrack" type="button" aria-label="下一首">›</button>
              <button id="connectDevice" type="button" aria-label="連接裝置">▣</button>
              <button id="showQueue" type="button" aria-label="播放佇列">≡</button>
            </div>
            <p id="playState" class="play-state">Spotify 播放</p>
          </article>
        </section>

        <section id="weather" class="stack-panel" aria-label="天氣">
          <article id="weatherCard" class="smart-card weather-card is-cloudy">
            <img id="weatherPhoto" class="weather-photo" src="./assets/weather-forest.svg" alt="" />
            <div class="weather-page-scrim"></div>
            <p id="weatherDesc" class="weather-condition">CLOUDY</p>
            <div class="weather-glass" aria-label="所在地天氣">
              <div class="weather-mini-label">今日天氣</div>
              <div class="weather-icon" aria-hidden="true">
                <img id="weatherIconImage" class="weather-icon-image" src="./assets/weather-cloudy.svg" alt="" />
                <span class="sun-core"></span>
                <span class="cloud cloud-a"></span>
                <span class="cloud cloud-b"></span>
              </div>
              <strong id="weatherTemp">--°</strong>
              <p class="weather-range">
                <span id="weatherLow">最低 --°</span>
                <span id="weatherHigh">最高 --°</span>
              </p>
            </div>
            <p class="weather-caption">
              <span id="weatherLocation">目前位置</span>
              <span id="weatherHumidity">濕度 --%</span>
              <span id="weatherRain">雨量 -- mm</span>
            </p>
          </article>
        </section>

        <section id="market" class="stack-panel" aria-label="市場資訊">
          <article id="marketCard" class="smart-card market-card">
            <div class="market-face market-front">
              <div class="market-topline">
                <span>市場</span>
                <button id="marketFlipButton" class="market-more-button" type="button" aria-label="設定股票">...</button>
              </div>
              <div id="marketMetrics" class="market-metrics">
                <div class="market-metric market-tone-0">
                  <p><span></span><b data-market-name>恒生指數</b></p>
                  <strong data-market-change>--%</strong>
                  <em data-market-value>--</em>
                </div>
                <div class="market-metric market-tone-1">
                  <p><span></span><b data-market-name>騰訊控股</b></p>
                  <strong data-market-change>--%</strong>
                  <em data-market-value>--</em>
                </div>
                <div class="market-metric market-tone-2">
                  <p><span></span><b data-market-name>小米集團</b></p>
                  <strong data-market-change>--%</strong>
                  <em data-market-value>--</em>
                </div>
                <div class="market-metric market-tone-3">
                  <p><span></span><b data-market-name>阿里巴巴</b></p>
                  <strong data-market-change>--%</strong>
                  <em data-market-value>--</em>
                </div>
              </div>
              <svg id="marketChart" class="market-chart" viewBox="0 0 560 142" role="img" aria-label="市場走勢">
                <path class="market-grid" d="M24 24 H536 M24 71 H536 M24 118 H536" />
                <path class="market-line market-line-0" data-market-line d="" />
                <path class="market-line market-line-1" data-market-line d="" />
                <path class="market-line market-line-2" data-market-line d="" />
                <path class="market-line market-line-3" data-market-line d="" />
              </svg>
              <p id="marketStatus" class="market-status">HKD · 今日走勢 · 更新 --:--</p>
            </div>
            <div class="market-face market-back" aria-label="設定股票">
              <div class="market-topline">
                <span>設定股票</span>
                <button id="marketBackButton" class="market-more-button market-close-button" type="button" aria-label="返回市場">×</button>
              </div>
              <form id="marketForm" class="market-settings-form">
                <p>恒生指數固定顯示。輸入另外三個股票代號。</p>
                <div class="market-symbol-row">
                  <label for="marketSymbol1">股票 1</label>
                  <div class="market-symbol-field">
                    <input id="marketSymbol1" data-market-symbol-input type="text" value="0700.HK" spellcheck="false" />
                    <input id="marketHidden1" class="market-hidden-input" data-market-hidden-input type="checkbox" />
                    <label class="market-eye-toggle" for="marketHidden1" aria-label="隱藏股票 1">
                      <span class="market-eye-icon" aria-hidden="true"></span>
                    </label>
                  </div>
                </div>
                <div class="market-symbol-row">
                  <label for="marketSymbol2">股票 2</label>
                  <div class="market-symbol-field">
                    <input id="marketSymbol2" data-market-symbol-input type="text" value="1810.HK" spellcheck="false" />
                    <input id="marketHidden2" class="market-hidden-input" data-market-hidden-input type="checkbox" />
                    <label class="market-eye-toggle" for="marketHidden2" aria-label="隱藏股票 2">
                      <span class="market-eye-icon" aria-hidden="true"></span>
                    </label>
                  </div>
                </div>
                <div class="market-symbol-row">
                  <label for="marketSymbol3">股票 3</label>
                  <div class="market-symbol-field">
                    <input id="marketSymbol3" data-market-symbol-input type="text" value="9988.HK" spellcheck="false" />
                    <input id="marketHidden3" class="market-hidden-input" data-market-hidden-input type="checkbox" />
                    <label class="market-eye-toggle" for="marketHidden3" aria-label="隱藏股票 3">
                      <span class="market-eye-icon" aria-hidden="true"></span>
                    </label>
                  </div>
                </div>
                <button type="submit">套用</button>
              </form>
            </div>
          </article>
        </section>
      </div>

      <nav class="stack-dots" aria-label="頁面選擇">
        <button class="dot is-active" type="button" aria-label="前往主頁" data-panel="0"></button>
        <button class="dot" type="button" aria-label="前往 Spotify" data-panel="1"></button>
        <button class="dot" type="button" aria-label="前往天氣" data-panel="2"></button>
        <button class="dot" type="button" aria-label="前往市場" data-panel="3"></button>
      </nav>
    </main>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
