<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>資訊顯示</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="display-shell" aria-label="640 乘 480 資訊顯示">
      <div id="stage" class="stage" aria-label="Smart Stack 資訊頁">
        <section id="home" class="stack-panel" aria-label="首頁">
          <article class="smart-card home-card">
            <img id="homeBackdrop" class="card-media" src="./assets/space-launch.svg" alt="" />
            <div class="hero-scrim"></div>
            <div class="lock-status" aria-hidden="true">鎖定</div>
            <div class="home-clock">
              <time id="clock" datetime="">00:00</time>
              <p id="dateText">5月27日 週三</p>
            </div>
            <div class="summary-pill">
              <span>今日摘要</span>
              <strong>日程、音樂與天氣已準備好。</strong>
            </div>
          </article>
        </section>

        <section id="spotify" class="stack-panel" aria-label="Spotify 正在播放">
          <article class="smart-card music-card">
            <img id="albumBackdrop" class="album-backdrop" src="./assets/spotify-album.svg" alt="" />
            <div class="hero-scrim music-scrim"></div>
            <div class="music-topline">
              <button id="spotifyLogin" class="device-pill" type="button">連接 Spotify</button>
            </div>
            <div class="music-copy">
              <p id="trackTitle">Good To Be</p>
              <span id="trackArtist">Mark Ambor</span>
            </div>
            <button id="playPause" class="widget-play-button" type="button" aria-label="暫停">
              <span class="pause-icon" aria-hidden="true"></span>
            </button>
            <div class="spotify-widget-controls" aria-label="Spotify 控制">
              <button id="saveTrack" type="button" aria-label="加入歌曲">＋</button>
              <div class="progress-shell" aria-hidden="true">
                <span id="progressBar" class="widget-progress"></span>
              </div>
              <button id="nextTrack" type="button" aria-label="下一首">⏭</button>
              <button id="connectDevice" type="button" aria-label="連線裝置">◉</button>
              <button id="showQueue" type="button" aria-label="播放佇列">▱</button>
            </div>
            <p id="playState" class="play-state">正在播放</p>
          </article>
        </section>

        <section id="weather" class="stack-panel" aria-label="天氣">
          <article id="weatherCard" class="smart-card weather-card is-cloudy">
            <img class="weather-photo" src="./assets/weather-forest.svg" alt="" />
            <div class="weather-page-scrim"></div>
            <p id="weatherDesc" class="weather-condition">CLOUDY</p>
            <div class="weather-glass" aria-label="香港天氣">
              <div class="weather-mini-label">室外天氣</div>
              <div class="weather-icon" aria-hidden="true">
                <span class="sun-core"></span>
                <span class="cloud cloud-a"></span>
                <span class="cloud cloud-b"></span>
              </div>
              <strong id="weatherTemp">--°</strong>
              <p class="weather-range">
                <span id="weatherLow">最低 --°</span>
                <span id="weatherHigh">最高 --°</span>
              </p>
            </div>
            <h2>Weather Information</h2>
            <p class="weather-caption">
              <span id="weatherLocation">香港</span>
              <span id="weatherHumidity">濕度 --%</span>
              <span id="weatherRain">雨量 -- mm</span>
            </p>
          </article>
        </section>
      </div>

      <nav class="stack-dots" aria-label="頁面切換">
        <button class="dot is-active" type="button" aria-label="前往首頁" data-panel="0"></button>
        <button class="dot" type="button" aria-label="前往 Spotify 正在播放" data-panel="1"></button>
        <button class="dot" type="button" aria-label="前往天氣" data-panel="2"></button>
      </nav>
    </main>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
